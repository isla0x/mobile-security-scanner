<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#E9EBEF;
    --panel:#FFFFFF;
    --line:#CFD3DA;
    --ink:#171A20;
    --ink-soft:#565C67;
    --brand:#2B3A67;
    --crit:#A82A20;
    --crit-bg:#FBEAE8;
    --high:#9A5B0E;
    --high-bg:#FBF0DF;
    --med:#7A6300;
    --med-bg:#FAF3D6;
    --low:#3B6E8F;
    --low-bg:#E7F0F5;
    --info:#5A6270;
    --info-bg:#EDEEF1;
  }

  *{box-sizing:border-box;}

  .msec-root{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans KR','IBM Plex Sans',sans-serif;
    padding:28px;
    min-height:100%;
  }

  .msec-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .msec-header-left .msec-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  .msec-title{
    font-family:'Source Serif 4', serif;
    font-size:30px;
    font-weight:600;
    line-height:1.15;
    margin:0;
  }
  .msec-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .msec-upload{
    font-family:'IBM Plex Sans KR',sans-serif;
    font-size:13px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--ink);
    padding:9px 14px;
    cursor:pointer;
    white-space:nowrap;
  }
  .msec-upload:hover{ background:var(--ink); color:var(--paper); }
  .msec-upload input{ display:none; }

  .msec-top{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  @media (max-width:720px){
    .msec-top{ grid-template-columns:1fr; }
  }

  .msec-gauge-card, .msec-stats-card{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px;
  }

  .msec-gauge-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .msec-gauge-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .msec-score-num{
    font-family:'Source Serif 4', serif;
    font-weight:700;
  }

  .msec-stats-card{
    display:flex;
    align-items:stretch;
  }
  .msec-stat{
    flex:1;
    padding:4px 16px;
    border-left:1px solid var(--line);
    cursor:pointer;
    transition:opacity .15s ease;
    user-select:none;
  }
  .msec-stat:first-child{ border-left:none; padding-left:2px; }
  .msec-stat.is-off{ opacity:0.35; }
  .msec-stat-count{
    font-family:'Source Serif 4', serif;
    font-size:34px;
    font-weight:700;
    line-height:1;
  }
  .msec-stat-name{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    margin-top:6px;
    letter-spacing:0.01em;
  }

  .msec-body{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:720px){
    .msec-body{ grid-template-columns:1fr; }
  }

  .msec-rail{
    background:var(--panel);
    border:1px solid var(--line);
  }
  .msec-rail-item{
    display:flex;
    justify-content:space-between;
    padding:10px 14px;
    font-size:13px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .msec-rail-item:last-child{ border-bottom:none; }
  .msec-rail-item:hover{ background:var(--paper); }
  .msec-rail-item.is-active{
    background:var(--ink);
    color:var(--paper);
  }
  .msec-rail-item .msec-rail-count{
    font-family:'IBM Plex Mono',monospace;
    color:inherit;
    opacity:0.6;
  }

  .msec-findings{ display:flex; flex-direction:column; gap:10px; }

  .msec-finding{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--info);
    padding:14px 16px;
  }
  .msec-finding[data-sev="Critical"]{ border-left-color:var(--crit); }
  .msec-finding[data-sev="High"]{ border-left-color:var(--high); }
  .msec-finding[data-sev="Medium"]{ border-left-color:var(--med); }
  .msec-finding[data-sev="Low"]{ border-left-color:var(--low); }
  .msec-finding[data-sev="Info"]{ border-left-color:var(--info); }

  .msec-finding-top{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .msec-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:500;
    padding:2px 7px;
    letter-spacing:0.02em;
  }
  .msec-tag.Critical{ background:var(--crit-bg); color:var(--crit); }
  .msec-tag.High{ background:var(--high-bg); color:var(--high); }
  .msec-tag.Medium{ background:var(--med-bg); color:var(--med); }
  .msec-tag.Low{ background:var(--low-bg); color:var(--low); }
  .msec-tag.Info{ background:var(--info-bg); color:var(--info); }

  .msec-finding-title{
    font-size:15px;
    font-weight:600;
  }
  .msec-finding-cat{
    font-size:12px;
    color:var(--ink-soft);
  }
  .msec-finding-desc{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:7px;
    line-height:1.5;
    max-width:70ch;
  }
  .msec-finding-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    flex-wrap:wrap;
    gap:6px;
  }
  .msec-finding-meta .msec-masvs{
    border:1px solid var(--line);
    padding:1px 6px;
  }

  .msec-empty{
    background:var(--panel);
    border:1px dashed var(--line);
    padding:30px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }
</style>

<div class="msec-root">
  <div class="msec-header">
    <div class="msec-header-left">
      <div class="msec-eyebrow" id="msec-eyebrow">MASVS STATIC AUDIT</div>
      <h1 class="msec-title" id="msec-target">com.example.vulnapp</h1>

  </div>

  <div class="msec-top">
    <div class="msec-gauge-card">
      <svg id="msec-gauge" width="150" height="90" viewBox="0 0 150 90"></svg>
      <div class="msec-gauge-label">보안 점수 (100점 만점)</div>
    </div>
    <div class="msec-stats-card" id="msec-stats"></div>
  </div>

  <div class="msec-body">
    <div class="msec-rail" id="msec-rail"></div>
    <div class="msec-findings" id="msec-findings"></div>
  </div>
</div>

  function renderGauge(){
    var score = state.report.score || 0;
    var svg = document.getElementById('msec-gauge');
    var cx = 75, cy = 78, r = 62;
    var startAngle = Math.PI, endAngle = 0; // semicircle, left to right (180deg to 0deg)
    function pt(angle){ return [cx + r*Math.cos(angle), cy - r*Math.sin(angle)]; }
    var track = describeArc(cx, cy, r, 180, 0);
    var pct = Math.max(0, Math.min(100, score)) / 100;
    var sweepDeg = 180 * pct;
    var valueArc = describeArc(cx, cy, r, 180, 180 - sweepDeg);

      '<path d="' + track + '" fill="none" stroke="#D9DCE2" stroke-width="12" stroke-linecap="round"/>' +

  function describeArc(cx, cy, r, startDeg, endDeg){
    function toRad(d){ return (d * Math.PI) / 180; }
    function point(deg){
      var rad = toRad(deg);
      return [cx + r * Math.cos(rad), cy - r * Math.sin(rad)];
    }
    var p1 = point(startDeg);
    var p2 = point(endDeg);
    var largeArc = Math.abs(startDeg - endDeg) > 180 ? 1 : 0;
    var sweep = startDeg > endDeg ? 1 : 0;
    return "M " + p1[0] + " " + p1[1] + " A " + r + " " + r + " 0 " + largeArc + " " + sweep + " " + p2[0] + " " + p2[1];
  }

  function renderStats(){
    var container = document.getElementById('msec-stats');
    var summary = state.report.summary || {};
    container.innerHTML = "";
    SEV_ORDER.forEach(function(sev){
      var count = summary[sev] || 0;
      var div = document.createElement('div');
      div.className = 'msec-stat' + (state.offSeverities[sev] ? ' is-off' : '');
      div.innerHTML =
        '<div class="msec-stat-count" style="color:' + SEV_COLOR[sev] + '">' + count + '</div>' +
        '<div class="msec-stat-name">' + sev.toUpperCase() + '</div>';
      div.addEventListener('click', function(){
        state.offSeverities[sev] = !state.offSeverities[sev];
        renderStats();
        renderFindings();
      });
      container.appendChild(div);
    });
  }

  function categoryCounts(){
    var counts = {};
    (state.report.findings || []).forEach(function(f){
      counts[f.category] = (counts[f.category] || 0) + 1;
    });
    return counts;
  }

  function renderRail(){
    var rail = document.getElementById('msec-rail');
    var counts = categoryCounts();
    var cats = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
    var total = (state.report.findings || []).length;

    rail.innerHTML = "";
    var allItem = document.createElement('div');
    allItem.className = 'msec-rail-item' + (state.activeCategory === '전체' ? ' is-active' : '');
    allItem.innerHTML = '<span>전체</span><span class="msec-rail-count">' + total + '</span>';
    allItem.addEventListener('click', function(){ state.activeCategory = '전체'; renderRail(); renderFindings(); });
    rail.appendChild(allItem);

    cats.forEach(function(cat){
      var item = document.createElement('div');
      item.className = 'msec-rail-item' + (state.activeCategory === cat ? ' is-active' : '');
      item.innerHTML = '<span>' + cat + '</span><span class="msec-rail-count">' + counts[cat] + '</span>';
      item.addEventListener('click', function(){ state.activeCategory = cat; renderRail(); renderFindings(); });
      rail.appendChild(item);
    });
  }

  function renderFindings(){
    var container = document.getElementById('msec-findings');
    var findings = (state.report.findings || []).slice();

    findings = findings.filter(function(f){
      if (state.offSeverities[f.severity]) return false;
      if (state.activeCategory !== '전체' && f.category !== state.activeCategory) return false;
      return true;
    });

    findings.sort(function(a,b){
      return SEV_ORDER.indexOf(a.severity) - SEV_ORDER.indexOf(b.severity);
    });

    container.innerHTML = "";

    if (findings.length === 0){
      var empty = document.createElement('div');
      empty.className = 'msec-empty';
      empty.textContent = '선택한 조건에 해당하는 이슈가 없습니다.';
      container.appendChild(empty);
      return;
    }

    findings.forEach(function(f){
      var card = document.createElement('div');
      card.className = 'msec-finding';
      card.setAttribute('data-sev', f.severity);
      card.innerHTML =
        '<div class="msec-finding-top">' +
          '<span class="msec-tag ' + f.severity + '">' + SEV_LABEL_KO[f.severity] + '</span>' +
          '<span class="msec-finding-title">' + escapeHtml(f.title) + '</span>' +
          '<span class="msec-finding-cat">· ' + escapeHtml(f.category) + '</span>' +
        '</div>' +
        '<div class="msec-finding-desc">' + escapeHtml(f.description || '') + '</div>' +
        '<div class="msec-finding-meta">' +
          '<span>' + escapeHtml(f.location || '') + '</span>' +
          (f.masvs_ref ? '<span class="msec-masvs">' + escapeHtml(f.masvs_ref) + '</span>' : '') +
        '</div>';
      container.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderAll(){
    state.offSeverities = {};
    state.activeCategory = "전체";
    renderGauge();
    renderStats();
    renderRail();
    renderFindings();
  }

  document.getElementById('msec-file-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        state.report = data;
        document.getElementById('msec-target').textContent = file.name.replace(/\.json$/i, '');
        document.getElementById('msec-meta').textContent = '업로드된 리포트 · ' + file.name;
        renderAll();
      }catch(err){
        alert('JSON 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      }
    };
    reader.readAsText(file);
  });

  renderAll();
})();
</script>
